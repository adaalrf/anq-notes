<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211b16" media="(prefers-color-scheme: dark)" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="robots" content="{{robots}}" />
    <link rel="canonical" href="{{canonical}}" />
    <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="/rss.xml" />
    <script src="/assets/theme.js"></script>
    <link
      rel="preload"
      href="/assets/fonts/anq-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/styles/site.css" />
  </head>
  <body id="top" tabindex="-1">
    <a class="skip" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/">{{siteTitle}}<small>A little space to write</small></a>
      <button
        class="theme-control"
        type="button"
        role="switch"
        aria-label="Dark mode"
        aria-checked="false"
        hidden
      >
        <span class="theme-track" aria-hidden="true"
          ><span class="theme-thumb">
            <svg
              viewBox="0 0 24 24"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <g class="theme-sun">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
                />
              </g>
              <path class="theme-moon" d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z" />
            </svg> </span
        ></span>
      </button>
      <nav aria-label="Main navigation">
        <a href="/blog/" {{writingCurrent}}>Writing</a>
        <a href="/tags/" {{topicsCurrent}}>Topics</a>
        <a href="/about/" {{aboutCurrent}}>About</a>
      </nav>
    </header>
    <main id="content" tabindex="-1">{{body}}</main>
    <footer class="site-footer">
      <p>
        Fictional sample publication. Built with ANQ Notes.
        <a href="https://adaalrf.dev/work/anq-notes/"
          >A project by Martin Røed Flyum<svg
            class="link-arrow"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 12 12 4M4 4h8v8" /></svg
        ></a>
      </p>
      <a href="/rss.xml">Subscribe via RSS</a>
    </footer>
    <nav aria-label="Page navigation">
      <a class="back-to-top" href="#top" aria-label="Back to top"
        ><svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M8 13V3m-4 4 4-4 4 4" /></svg
        >Top</a
      >
    </nav>
  </body>
</html>
